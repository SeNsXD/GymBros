<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GymBros – Arctic update</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--mint:#38E89F;--cy:#4DE1FF;--or:#FF7A3C;--mut:#8A90A8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0A0B10;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#F2F5FA}
#s{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.glow{position:absolute;width:150vmin;height:150vmin;border-radius:50%;left:50%;top:34%;transform:translate(-50%,-50%);transition:opacity 1.2s;opacity:0;pointer-events:none}
.go{background:radial-gradient(circle,rgba(255,106,26,.42),transparent 62%)}
.gb{background:radial-gradient(circle,rgba(56,232,159,.36),rgba(77,225,255,.15) 42%,transparent 66%)}
[data-st="1"] .go{opacity:1;animation:pulse 1.6s ease-in-out infinite}
[data-st="2"] .go{opacity:.6}[data-st="2"] .gb{opacity:0}
[data-st="2"].mint .go{opacity:0}[data-st="2"].mint .gb,[data-st="3"] .gb{opacity:1}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}
#logo{margin-top:12vh;width:min(58vw,300px);aspect-ratio:1;border-radius:22%;transform:scale(.7);opacity:0;transition:transform 1s cubic-bezier(.2,1.3,.4,1),opacity .8s;position:relative;z-index:1}
[data-st] #logo{transform:scale(1);opacity:1}
[data-st="1"] #logo{animation:heat .12s infinite alternate}
@keyframes heat{to{transform:translate(1.5px,-1px) scale(1.01)}}
.t{position:absolute;left:0;right:0;top:calc(12vh + min(58vw,300px) + 6vh);text-align:center;padding:0 20px;opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s;pointer-events:none}
[data-st="1"] .t1,[data-st="2"] .t2,[data-st="3"] .t3{opacity:1;transform:none}
.big{font-size:clamp(34px,10.5vw,58px);font-weight:900;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}
.sm{font-size:14px;letter-spacing:.5em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;padding-left:.5em}
.og{background:linear-gradient(90deg,#FFB020,var(--or) 60%,#FF4A1A);-webkit-background-clip:text;background-clip:text;color:transparent}
.bg{background:linear-gradient(90deg,var(--mint),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.arc{margin-top:6px;font-size:clamp(28px,8.5vw,46px);font-weight:800;text-transform:uppercase;letter-spacing:.32em;padding-left:.32em}
.t2 .arc{opacity:0;filter:blur(8px);letter-spacing:1em;transition:all 1s 0s cubic-bezier(.2,.8,.2,1)}
[data-st="2"] .t2 .arc{opacity:1;filter:none;letter-spacing:.32em}
.t3 .big{margin:0}
#cta{margin-top:26px;pointer-events:auto;background:linear-gradient(90deg,var(--mint),var(--cy));color:#06210F;font-weight:800;border:0;border-radius:99px;padding:15px 44px;font-size:16px;letter-spacing:.06em;box-shadow:0 0 30px rgba(56,232,159,.35)}
#dots{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:2}
#dots i{width:22px;height:4px;border-radius:2px;background:#262A40;transition:background .4s}
[data-st="1"] #dots i:nth-child(1),[data-st="2"] #dots i:nth-child(-n+2),[data-st="3"] #dots i{background:var(--mint)}
[data-st="1"] #dots i:nth-child(1){background:var(--or)}
#rp{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:none;border:0;color:var(--mut);font-size:13px;letter-spacing:.1em}
</style></head><body>
<div id="s"><div class="glow go"></div><div class="glow gb"></div>
<div id="dots"><i></i><i></i><i></i></div>
<img id="logo" alt="GymBros logo">
<div class="t t1"><div class="big">Things just got</div><div class="big og">out of hand</div></div>
<div class="t t2"><div class="sm">Meet the new</div><div class="big">Gym Bros</div><div class="arc bg">Arctic</div></div>
<div class="t t3"><div class="big">Stay Cool,</div><div class="big bg">Lift Hard</div><button id="cta">LET'S GO</button></div>
<button id="rp">↻ Replay</button></div>
